name: Secrets Test

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Secret überprüfen
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "Secret erfolgreich geladen."
          else
            echo "Secret fehlt."
            exit 1
          fi
